services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:?Defina DB_PORT no .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:?Defina API_PORT no .env}
      HOST: ${API_HOST:?Defina API_HOST no .env}
      PGHOST: ${POSTGRES_HOST:?Defina POSTGRES_HOST no .env}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./web
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://${API_SERVICE_HOST:?Defina API_SERVICE_HOST no .env}:${API_PORT}
      HOSTNAME: ${WEB_HOST:?Defina WEB_HOST no .env}
      PORT: ${WEB_PORT:?Defina WEB_PORT no .env}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
